name: Build/release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Build macOS installer
        if: matrix.platform == 'macOS'
        run: yarn electron-builder --config build/electron-builder.adhoc.cjs --mac dmg --publish never

      - name: Build Linux installers
        if: matrix.platform == 'Linux'
        run: yarn electron-builder --linux AppImage deb --publish never

      - name: Build Windows installer
        if: matrix.platform == 'Windows'
        run: yarn electron-builder --win nsis --publish never

      - name: Upload macOS installer
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-installer
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Linux installers
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove obsolete non-installer assets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.github_token }}
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const installerPattern = /\.(dmg|exe|AppImage|deb)$/i;
            for (const asset of release.assets) {
              if (!installerPattern.test(asset.name)) {
                core.info(`Deleting non-installer asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
